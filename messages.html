<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages | Planet ArcadiX</title>
  <style>
    :root {
      --bg-color: #0b0b12;
      --card-bg: #13131f;
      --card-border: #232338;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text-color: #ffffff;
      --text-muted: #8e8ea0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
    header a { color: var(--text-color); text-decoration: none; font-weight: bold; }

    .messenger-container { display: flex; flex: 1; overflow: hidden; }

    /* Conversations Sidebar */
    .sidebar { width: 300px; border-right: 1px solid var(--card-border); background: var(--card-bg); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--card-border); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    .chat-list { flex: 1; overflow-y: auto; }
    .chat-user-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
    .chat-user-item:hover, .chat-user-item.active { background: rgba(168, 85, 247, 0.15); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card-border); object-fit: cover; }
    .user-info .name { font-weight: 600; font-size: 14px; }
    .user-info .subtext { font-size: 12px; color: var(--text-muted); }

    /* Main Chat Viewport */
    .chat-viewport { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--card-border); background: var(--card-bg); font-weight: bold; }
    .messages-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    /* Message Bubbles */
    .message { max-width: 65%; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .message.sent { align-self: flex-end; background: var(--accent-color); color: #fff; border-bottom-right-radius: 2px; box-shadow: 0 0 10px var(--accent-glow); }
    .message.received { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); border-bottom-left-radius: 2px; }
    .message-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

    /* Message Input Box */
    .chat-input-row { padding: 16px 24px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 12px; }
    .chat-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 16px; color: var(--text-color); outline: none; }
    .chat-input:focus { border-color: var(--accent-color); }
    .send-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.9; }

    .empty-state { margin: auto; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

  <header>
    <a href="index.html">&larr; Return to Planet ArcadiX</a>
    <div>Direct Messages</div>
  </header>

  <div class="messenger-container">
    <!-- Sidebar: Registered Users List -->
    <div class="sidebar">
      <div class="sidebar-header">Conversations</div>
      <div class="chat-list" id="users-list">
        <div style="padding:16px; font-size:12px; color:var(--text-muted);">Loading members...</div>
      </div>
    </div>

    <!-- Main Active Chat Area -->
    <div class="chat-viewport">
      <div class="chat-header" id="active-chat-header">Select a conversation</div>
      <div class="messages-body" id="messages-container">
        <div class="empty-state">Choose a user from the left menu to start messaging.</div>
      </div>
      <form class="chat-input-row" id="message-form" style="display: none;">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </div>

  <!-- Firebase Modular SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Insert your Firebase Project Config here
    const firebaseConfig = {
      apiKey: "AIzaSyBIvUkO_paPfmMlbo5jNaXoteZL0fkZYa4",
      authDomain: "arcadix-7fc11.firebaseapp.com",
      projectId: "arcadix-7fc11",
      storageBucket: "arcadix-7fc11.appspot.com",
      messagingSenderId: "1024578621730",
      appId: "1:1024578621730:web:27adc1e3b5cdb802f1557b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let activeRecipient = null;
    let activeUnsubscribe = null;

    // Helper: Generate a unique conversation key between two UIDs
    function getChatRoomId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    // Check Authentication
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html?page=login';
        return;
      }
      currentUser = user;
      loadUsersList();
    });

    // Load available users to chat with
    async function loadUsersList() {
      const usersListEl = document.getElementById('users-list');
      usersListEl.innerHTML = '';

      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        querySnapshot.forEach((docSnap) => {
          const userData = docSnap.data();
          const uid = docSnap.id;

          // Skip rendering self
          if (uid === currentUser.uid) return;

          const userItem = document.createElement('div');
          userItem.className = 'chat-user-item';
          userItem.dataset.uid = uid;
          userItem.innerHTML = `
            <img src="${userData.photoURL || 'https://via.placeholder.com/40'}" class="avatar" alt="Avatar">
            <div class="user-info">
              <div class="name">${userData.username || userData.email?.split('@')[0] || 'Player'}</div>
              <div class="subtext">Click to message</div>
            </div>
          `;

          userItem.addEventListener('click', () => selectUser(uid, userData));
          usersListEl.appendChild(userItem);
        });
      } catch (err) {
        usersListEl.innerHTML = `<div style="padding:16px; color:red; font-size:12px;">Failed to load users: ${err.message}</div>`;
      }
    }

    // Select target chat user
    function selectUser(targetUid, targetData) {
      activeRecipient = { uid: targetUid, ...targetData };

      // Update UI active states
      document.querySelectorAll('.chat-user-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.querySelector(`.chat-user-item[data-uid="${targetUid}"]`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('active-chat-header').textContent = `Chat with ${targetData.username || 'Player'}`;
      document.getElementById('message-form').style.display = 'flex';

      listenForMessages();
    }

    // Real-Time Firestore Messages Listener
    function listenForMessages() {
      if (activeUnsubscribe) activeUnsubscribe(); // Stop listening to previous chat

      const roomId = getChatRoomId(currentUser.uid, activeRecipient.uid);
      const messagesContainer = document.getElementById('messages-container');

      const q = query(
        collection(db, "messages"),
        where("roomId", "==", roomId),
        orderBy("timestamp", "asc")
      );

      activeUnsubscribe = onSnapshot(q, (snapshot) => {
        messagesContainer.innerHTML = '';

        if (snapshot.empty) {
          messagesContainer.innerHTML = '<div class="empty-state">No messages yet. Say hi!</div>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const isSentObj = msg.senderId === currentUser.uid;

          const msgBubble = document.createElement('div');
          msgBubble.className = `message ${isSentObj ? 'sent' : 'received'}`;
          
          const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          
          msgBubble.innerHTML = `
            <div>${msg.text}</div>
            <div class="message-time">${timeStr}</div>
          `;
          messagesContainer.appendChild(msgBubble);
        });

        // Auto-scroll to bottom of chat
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    // Send Message Event
    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();

      if (!text || !activeRecipient) return;

      const roomId = getChatRoomId(currentUser.uid, activeRecipient.uid);
      inputEl.value = '';

      try {
        await addDoc(collection(db, "messages"), {
          roomId: roomId,
          senderId: currentUser.uid,
          recipientId: activeRecipient.uid,
          text: text,
          timestamp: Date.now()
        });
      } catch (err) {
        alert("Failed to send message: " + err.message);
      }
    });
  </script>
</body>
</html>
