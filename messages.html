<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages | Planet ArcadiX</title>
  <style>
    :root {
      --bg-color: #0b0b12;
      --card-bg: #13131f;
      --card-border: #232338;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text-color: #ffffff;
      --text-muted: #8e8ea0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
    header a { color: var(--text-color); text-decoration: none; font-weight: bold; }

    .messenger-container { display: flex; flex: 1; overflow: hidden; }

    /* Conversations Sidebar */
    .sidebar { width: 300px; border-right: 1px solid var(--card-border); background: var(--card-bg); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--card-border); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
    
    .create-group-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: bold; }

    /* Search Controls */
    .search-box-container { padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; gap: 8px; }
    .search-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 12px; color: var(--text-color); font-size: 13px; outline: none; }
    .search-input:focus { border-color: var(--accent-color); }
    .search-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-weight: bold; cursor: pointer; font-size: 13px; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-user-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
    .chat-user-item:hover, .chat-user-item.active { background: rgba(168, 85, 247, 0.15); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card-border); object-fit: cover; }
    .user-info .name { font-weight: 600; font-size: 14px; }
    .user-info .subtext { font-size: 12px; color: var(--text-muted); }

    /* Main Chat Viewport */
    .chat-viewport { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); position: relative; }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--card-border); background: var(--card-bg); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .messages-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    /* Drag & Drop Overlay */
    .drag-overlay {
      position: absolute; inset: 0; background: rgba(168, 85, 247, 0.2); backdrop-filter: blur(2px);
      border: 2px dashed var(--accent-color); display: none; align-items: center; justify-content: center;
      font-size: 18px; font-weight: bold; color: #fff; z-index: 50; pointer-events: none;
    }

    /* Message Bubbles */
    .message { max-width: 65%; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .message.sent { align-self: flex-end; background: var(--accent-color); color: #fff; border-bottom-right-radius: 2px; box-shadow: 0 0 10px var(--accent-glow); }
    .message.received { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); border-bottom-left-radius: 2px; }
    .message-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
    .message-media { max-width: 100%; max-height: 300px; border-radius: 8px; margin-top: 6px; display: block; object-fit: contain; }

    /* Message Input Box */
    .chat-input-row { padding: 16px 24px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 12px; align-items: center; }
    .attachment-btn { background: transparent; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .attachment-btn img { width: 24px; height: 24px; object-fit: contain; }
    .chat-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 16px; color: var(--text-color); outline: none; }
    .chat-input:focus { border-color: var(--accent-color); }
    .send-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 8px; padding: 12px 20px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.9; }

    /* Members Sidebar */
    .members-sidebar { width: 240px; background: var(--card-bg); border-left: 1px solid var(--card-border); padding: 16px; display: none; flex-direction: column; gap: 12px; overflow-y: auto; }
    .members-title { font-size: 12px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }
    .member-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .member-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .member-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .owner-icon { width: 16px; height: 16px; object-fit: contain; }
    .kick-btn { color: var(--danger); background: transparent; border: none; cursor: pointer; font-weight: bold; font-size: 12px; margin-left: auto; }

    /* Modals */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 8px; width: 320px; display: flex; flex-direction: column; gap: 12px; }
    .modal-box h3 { font-size: 16px; text-align: center; }
    .modal-box input { background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 12px; color: #fff; outline: none; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-confirm { background: var(--accent-color); color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    .empty-state { margin: auto; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

  <header>
    <a href="index.html">&larr; Return to Planet ArcadiX</a>
    <div>Direct Messages</div>
  </header>

  <div class="messenger-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Conversations</span>
        <button class="create-group-btn" id="open-group-modal">+ Group</button>
      </div>
      <form class="search-box-container" id="user-search-form">
        <input type="text" id="search-username" class="search-input" placeholder="Type username..." required autocomplete="off">
        <button type="submit" class="search-btn">Chat</button>
      </form>
      <div class="chat-list" id="users-list">
        <div style="padding:16px; font-size:12px; color:var(--text-muted);">Loading conversations...</div>
      </div>
    </div>

    <!-- Main Active Chat Area -->
    <div class="chat-viewport" id="chat-viewport">
      <div class="drag-overlay" id="drag-overlay">Drop image or video here (Max 250MB)</div>
      <div class="chat-header">
        <span id="active-chat-header">Select or start a conversation</span>
        <button class="create-group-btn" id="open-add-member" style="display: none;">+ Add Member</button>
      </div>
      <div class="messages-body" id="messages-container">
        <div class="empty-state">Search a username or select an active conversation on the left.</div>
      </div>
      <form class="chat-input-row" id="message-form" style="display: none;">
        <input type="file" id="file-input" accept="image/*,video/*" style="display: none;">
        <button type="button" class="attachment-btn" id="attachment-btn">
          <img src="ArcadiX/PAXIcons/AddAnAttachment.png" alt="Attach">
        </button>
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." autocomplete="off">
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>

    <!-- Right Sidebar for Group Members -->
    <div class="members-sidebar" id="members-sidebar">
      <div class="members-title" id="members-count">Members—0</div>
      <div id="members-list"></div>
    </div>
  </div>

  <!-- Create Group Modal -->
  <div class="modal" id="group-modal">
    <div class="modal-box">
      <h3>Create Group Chat</h3>
      <input type="text" id="group-name-input" placeholder="Group Name">
      <div class="modal-actions">
        <button class="btn-cancel" id="close-group-modal">Cancel</button>
        <button class="btn-confirm" id="confirm-create-group">Create</button>
      </div>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div class="modal" id="add-member-modal">
    <div class="modal-box">
      <h3>Add Member (Max 10)</h3>
      <input type="text" id="add-username-input" placeholder="Enter Username">
      <div class="modal-actions">
        <button class="btn-cancel" id="close-add-member">Cancel</button>
        <button class="btn-confirm" id="confirm-add-member">Add</button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK Scripts -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, query, where, onSnapshot, getDocs, doc, getDoc, updateDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIvUkO_paPfmMlbo5jNaXoteZL0fkZYa4",
      authDomain: "arcadix-7fc11.firebaseapp.com",
      projectId: "arcadix-7fc11",
      storageBucket: "arcadix-7fc11.appspot.com",
      messagingSenderId: "1024578621730",
      appId: "1:1024578621730:web:27adc1e3b5cdb802f1557b"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let currentUser = null;
    let activeChatId = null;
    let activeChatData = null;
    let activeUnsubscribe = null;
    const defaultAvatar = "/ArcadiX/PAXIcons/PlaceholderPFP.png";

    function getChatRoomId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html?page=login';
        return;
      }
      currentUser = user;
      loadChats();
    });

    // Load active direct chats & group chats
    function loadChats() {
      const usersListEl = document.getElementById('users-list');
      const qGroups = query(collection(db, "chats"), where("members", "array-contains", currentUser.uid));

      onSnapshot(qGroups, async (groupSnap) => {
        usersListEl.innerHTML = '';
        
        groupSnap.forEach((docSnap) => {
          const gData = docSnap.data();
          const item = document.createElement('div');
          item.className = `chat-user-item ${activeChatId === docSnap.id ? 'active' : ''}`;
          item.innerHTML = `
            <img src="${gData.icon || defaultAvatar}" class="avatar" alt="Avatar">
            <div class="user-info">
              <div class="name">${gData.name || 'Group Chat'}</div>
              <div class="subtext">Group Chat</div>
            </div>
          `;
          item.onclick = () => selectChat(docSnap.id, gData, true);
          usersListEl.appendChild(item);
        });

        // Load 1-on-1 chats
        const sentQuery = query(collection(db, "messages"), where("senderId", "==", currentUser.uid));
        const recvQuery = query(collection(db, "messages"), where("recipientId", "==", currentUser.uid));
        const [sentSnap, recvSnap] = await Promise.all([getDocs(sentQuery), getDocs(recvQuery)]);
        
        const partnerUids = new Set();
        sentSnap.forEach(d => partnerUids.add(d.data().recipientId));
        recvSnap.forEach(d => partnerUids.add(d.data().senderId));

        for (const uid of partnerUids) {
          if (!uid || uid === currentUser.uid) continue;
          const userDoc = await getDoc(doc(db, "users", uid));
          if (userDoc.exists()) {
            const uData = userDoc.data();
            const roomId = getChatRoomId(currentUser.uid, uid);
            const item = document.createElement('div');
            item.className = `chat-user-item ${activeChatId === roomId ? 'active' : ''}`;
            item.innerHTML = `
              <img src="${uData.photoURL || defaultAvatar}" class="avatar" alt="Avatar">
              <div class="user-info">
                <div class="name">${uData.username || 'Player'}</div>
                <div class="subtext">Direct Message</div>
              </div>
            `;
            item.onclick = () => selectChat(roomId, { uid, ...uData }, false);
            usersListEl.appendChild(item);
          }
        }
      });
    }

    // Select active chat room
    function selectChat(chatId, chatData, isGroup) {
      activeChatId = chatId;
      activeChatData = { ...chatData, isGroup };

      document.getElementById('active-chat-header').textContent = isGroup ? chatData.name : (chatData.username || 'Player');
      document.getElementById('message-form').style.display = 'flex';
      document.getElementById('open-add-member').style.display = isGroup ? 'block' : 'none';

      if (isGroup) {
        document.getElementById('members-sidebar').style.display = 'flex';
        renderMembersSidebar(chatData);
      } else {
        document.getElementById('members-sidebar').style.display = 'none';
      }

      listenForMessages(chatId, isGroup);
    }

    // Render Group Members List
    async function renderMembersSidebar(data) {
      const container = document.getElementById('members-list');
      const countEl = document.getElementById('members-count');
      container.innerHTML = '';

      if (!data.members) return;
      countEl.textContent = `Members—${data.members.length}`;

      for (const uid of data.members) {
        const uDoc = await getDoc(doc(db, "users", uid));
        const uData = uDoc.exists() ? uDoc.data() : { username: 'User' };
        const isOwner = data.ownerId === uid;
        const canKick = data.ownerId === currentUser.uid && uid !== currentUser.uid;

        const item = document.createElement('div');
        item.className = 'member-item';
        item.innerHTML = `
          <img src="${uData.photoURL || defaultAvatar}" class="member-avatar">
          <span class="member-name">${uData.username || 'Player'}</span>
          ${isOwner ? `<img src="ArcadiX/PAXIcons/GroupOwnerIcon.png" class="owner-icon" title="Owner">` : ''}
          ${canKick ? `<button class="kick-btn" data-uid="${uid}">✕</button>` : ''}
        `;

        if (canKick) {
          item.querySelector('.kick-btn').onclick = () => removeMember(uid);
        }

        container.appendChild(item);
      }
    }

    // Listen for incoming/outgoing messages
    function listenForMessages(chatId, isGroup) {
      if (activeUnsubscribe) activeUnsubscribe();
      const container = document.getElementById('messages-container');

      let q;
      if (isGroup) {
        q = query(collection(db, "chats", chatId, "messages"));
      } else {
        q = query(collection(db, "messages"), where("roomId", "==", chatId));
      }

      activeUnsubscribe = onSnapshot(q, (snapshot) => {
        container.innerHTML = '';
        if (snapshot.empty) {
          container.innerHTML = '<div class="empty-state">No messages yet. Say hi!</div>';
          return;
        }

        // Collect documents and sort in memory by timestamp ascending
        const docs = snapshot.docs.map(doc => doc.data());
        docs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

        docs.forEach((msg) => {
          const isSent = msg.senderId === currentUser.uid;
          const bubble = document.createElement('div');
          bubble.className = `message ${isSent ? 'sent' : 'received'}`;
          
          let mediaHtml = '';
          if (msg.mediaUrl) {
            if (msg.mediaType && msg.mediaType.startsWith('video/')) {
              mediaHtml = `<video src="${msg.mediaUrl}" controls class="message-media"></video>`;
            } else {
              mediaHtml = `<img src="${msg.mediaUrl}" class="message-media">`;
            }
          }

          const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          bubble.innerHTML = `
            ${isGroup && !isSent ? `<div style="font-size:10px; opacity:0.8; font-weight:bold;">${msg.senderName || 'User'}</div>` : ''}
            ${msg.text ? `<div>${msg.text}</div>` : ''}
            ${mediaHtml}
            <div class="message-time">${timeStr}</div>
          `;
          container.appendChild(bubble);
        });

        container.scrollTop = container.scrollHeight;
      }, (err) => {
        console.error("Error loading messages:", err);
      });
    }

    // Send Message / Upload Media
    async function sendMessage(text = '', file = null) {
      if (!activeChatId) return;
      if (!text && !file) return;

      let mediaUrl = null;
      let mediaType = null;

      if (file) {
        if (file.size > 250 * 1024 * 1024) {
          alert("File size exceeds maximum limit of 250 MB.");
          return;
        }
        const fileRef = ref(storage, `chat_media/${Date.now()}_${file.name}`);
        await uploadBytes(fileRef, file);
        mediaUrl = await getDownloadURL(fileRef);
        mediaType = file.type;
      }

      const payload = {
        senderId: currentUser.uid,
        senderName: currentUser.displayName || 'Player',
        text: text,
        mediaUrl: mediaUrl,
        mediaType: mediaType,
        timestamp: Date.now()
      };

      if (activeChatData.isGroup) {
        await addDoc(collection(db, "chats", activeChatId, "messages"), payload);
      } else {
        payload.roomId = activeChatId;
        payload.recipientId = activeChatData.uid;
        await addDoc(collection(db, "messages"), payload);
      }
    }

    // Form submission
    document.getElementById('message-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      input.value = '';
      await sendMessage(text, null);
    };

    // File input handling
    const fileInput = document.getElementById('file-input');
    document.getElementById('attachment-btn').onclick = () => fileInput.click();
    fileInput.onchange = async () => {
      if (fileInput.files.length > 0) {
        await sendMessage('', fileInput.files[0]);
        fileInput.value = '';
      }
    };

    // Drag and Drop Attachment Handling
    const viewport = document.getElementById('chat-viewport');
    const dragOverlay = document.getElementById('drag-overlay');

    viewport.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.style.display = 'flex'; });
    viewport.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) dragOverlay.style.display = 'none'; });
    viewport.addEventListener('drop', async (e) => {
      e.preventDefault();
      dragOverlay.style.display = 'none';
      if (e.dataTransfer.files.length > 0) {
        await sendMessage('', e.dataTransfer.files[0]);
      }
    });

    // Direct User Search Form
    document.getElementById('user-search-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('search-username');
      const target = input.value.trim();
      if (!target) return;

      const q = query(collection(db, "users"), where("username", "==", target));
      const snap = await getDocs(q);
      if (snap.empty) {
        alert(`User "${target}" not found.`);
        return;
      }

      let targetUid = null, targetData = null;
      snap.forEach(d => { targetUid = d.id; targetData = d.data(); });

      if (targetUid === currentUser.uid) {
        alert("You cannot message yourself.");
        return;
      }

      input.value = '';
      const roomId = getChatRoomId(currentUser.uid, targetUid);
      selectChat(roomId, { uid: targetUid, ...targetData }, false);
    };

    // Group Modal Controls
    document.getElementById('open-group-modal').onclick = () => document.getElementById('group-modal').style.display = 'flex';
    document.getElementById('close-group-modal').onclick = () => document.getElementById('group-modal').style.display = 'none';
    
    document.getElementById('confirm-create-group').onclick = async () => {
      const name = document.getElementById('group-name-input').value.trim();
      if (!name) return;

      await addDoc(collection(db, "chats"), {
        name: name,
        isGroup: true,
        ownerId: currentUser.uid,
        members: [currentUser.uid],
        createdAt: Date.now()
      });

      document.getElementById('group-modal').style.display = 'none';
      document.getElementById('group-name-input').value = '';
    };

    // Member Management (Max 10)
    document.getElementById('open-add-member').onclick = () => document.getElementById('add-member-modal').style.display = 'flex';
    document.getElementById('close-add-member').onclick = () => document.getElementById('add-member-modal').style.display = 'none';

    document.getElementById('confirm-add-member').onclick = async () => {
      const username = document.getElementById('add-username-input').value.trim();
      if (!username || !activeChatId) return;

      if (activeChatData.members.length >= 10) {
        alert("Group chat member limit (10) reached!");
        return;
      }

      const q = query(collection(db, "users"), where("username", "==", username));
      const snap = await getDocs(q);
      if (snap.empty) {
        alert(`User "${username}" not found.`);
        return;
      }

      let newUid = null;
      snap.forEach(d => newUid = d.id);

      await updateDoc(doc(db, "chats", activeChatId), {
        members: arrayUnion(newUid)
      });

      activeChatData.members.push(newUid);
      renderMembersSidebar(activeChatData);
      document.getElementById('add-member-modal').style.display = 'none';
      document.getElementById('add-username-input').value = '';
    };

    async function removeMember(uid) {
      if (!activeChatId) return;
      await updateDoc(doc(db, "chats", activeChatId), {
        members: arrayRemove(uid)
      });
      activeChatData.members = activeChatData.members.filter(m => m !== uid);
      renderMembersSidebar(activeChatData);
    }
  </script>
</body>
</html>
