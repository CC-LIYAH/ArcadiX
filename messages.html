<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Direct Messages | Planet ArcadiX</title>
  <style>
    :root {
      --bg-color: #0b0b12;
      --card-bg: #13131f;
      --card-border: #232338;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text-color: #ffffff;
      --text-muted: #8e8ea0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: var(--card-bg); border-bottom: 1px solid var(--card-border); }
    header a { color: var(--text-color); text-decoration: none; font-weight: bold; }

    .messenger-container { display: flex; flex: 1; overflow: hidden; }

    /* Conversations Sidebar */
    .sidebar { width: 300px; border-right: 1px solid var(--card-border); background: var(--card-bg); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--card-border); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
    
    /* New Search Controls */
    .search-box-container { padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; gap: 8px; }
    .search-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 6px; padding: 8px 12px; color: var(--text-color); font-size: 13px; outline: none; }
    .search-input:focus { border-color: var(--accent-color); }
    .search-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 6px; padding: 0 12px; font-weight: bold; cursor: pointer; font-size: 13px; }

    .chat-list { flex: 1; overflow-y: auto; }
    .chat-user-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
    .chat-user-item:hover, .chat-user-item.active { background: rgba(168, 85, 247, 0.15); }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card-border); object-fit: cover; }
    .user-info .name { font-weight: 600; font-size: 14px; }
    .user-info .subtext { font-size: 12px; color: var(--text-muted); }

    /* Main Chat Viewport */
    .chat-viewport { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    .chat-header { padding: 16px 24px; border-bottom: 1px solid var(--card-border); background: var(--card-bg); font-weight: bold; }
    .messages-body { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    /* Message Bubbles */
    .message { max-width: 65%; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .message.sent { align-self: flex-end; background: var(--accent-color); color: #fff; border-bottom-right-radius: 2px; box-shadow: 0 0 10px var(--accent-glow); }
    .message.received { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border); border-bottom-left-radius: 2px; }
    .message-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

    /* Message Input Box */
    .chat-input-row { padding: 16px 24px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; gap: 12px; }
    .chat-input { flex: 1; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 16px; color: var(--text-color); outline: none; }
    .chat-input:focus { border-color: var(--accent-color); }
    .send-btn { background: var(--accent-color); color: #fff; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.9; }

    .empty-state { margin: auto; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

  <header>
    <a href="index.html">&larr; Return to Planet ArcadiX</a>
    <div>Direct Messages</div>
  </header>

  <div class="messenger-container">
    <!-- Sidebar: Active Conversations + User Search -->
    <div class="sidebar">
      <div class="sidebar-header">Conversations</div>
      <form class="search-box-container" id="user-search-form">
        <input type="text" id="search-username" class="search-input" placeholder="Type username..." required autocomplete="off">
        <button type="submit" class="search-btn">Chat</button>
      </form>
      <div class="chat-list" id="users-list">
        <div style="padding:16px; font-size:12px; color:var(--text-muted);">Loading conversations...</div>
      </div>
    </div>

    <!-- Main Active Chat Area -->
    <div class="chat-viewport">
      <div class="chat-header" id="active-chat-header">Select or start a conversation</div>
      <div class="messages-body" id="messages-container">
        <div class="empty-state">Search a username or select an active conversation on the left.</div>
      </div>
      <form class="chat-input-row" id="message-form" style="display: none;">
        <input type="text" id="message-input" class="chat-input" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </div>

  <!-- Firebase Modular SDK Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, addDoc, query, where, onSnapshot, getDocs, doc, getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIvUkO_paPfmMlbo5jNaXoteZL0fkZYa4",
      authDomain: "arcadix-7fc11.firebaseapp.com",
      projectId: "arcadix-7fc11",
      storageBucket: "arcadix-7fc11.appspot.com",
      messagingSenderId: "1024578621730",
      appId: "1:1024578621730:web:27adc1e3b5cdb802f1557b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let activeRecipient = null;
    let activeUnsubscribe = null;
    let activeConversations = new Map();
    const defaultAvatar = "/ArcadiX/PAXIcons/PlaceholderPFP.png";

    function getChatRoomId(uid1, uid2) {
      return [uid1, uid2].sort().join('_');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html?page=login';
        return;
      }
      currentUser = user;
      loadRecentConversations();
    });

    // Load only users that current user has an active chat history with
    async function loadRecentConversations() {
      const usersListEl = document.getElementById('users-list');
      
      try {
        const sentQuery = query(collection(db, "messages"), where("senderId", "==", currentUser.uid));
        const recvQuery = query(collection(db, "messages"), where("recipientId", "==", currentUser.uid));

        const [sentSnap, recvSnap] = await Promise.all([getDocs(sentQuery), getDocs(recvQuery)]);
        
        const partnerUids = new Set();
        sentSnap.forEach(d => partnerUids.add(d.data().recipientId));
        recvSnap.forEach(d => partnerUids.add(d.data().senderId));

        if (partnerUids.size === 0) {
          usersListEl.innerHTML = '<div style="padding:16px; font-size:12px; color:var(--text-muted);">No active chats. Search a user to start chatting!</div>';
          return;
        }

        activeConversations.clear();
        for (const uid of partnerUids) {
          if (uid === currentUser.uid) continue;
          const userDoc = await getDoc(doc(db, "users", uid));
          if (userDoc.exists()) {
            activeConversations.set(uid, userDoc.data());
          }
        }

        renderSidebarList();
      } catch (err) {
        usersListEl.innerHTML = `<div style="padding:16px; color:red; font-size:12px;">Error loading chats: ${err.message}</div>`;
      }
    }

    function renderSidebarList() {
      const usersListEl = document.getElementById('users-list');
      usersListEl.innerHTML = '';

      if (activeConversations.size === 0) {
        usersListEl.innerHTML = '<div style="padding:16px; font-size:12px; color:var(--text-muted);">No active chats.</div>';
        return;
      }

      activeConversations.forEach((userData, uid) => {
        const userItem = document.createElement('div');
        userItem.className = 'chat-user-item';
        userItem.dataset.uid = uid;
        if (activeRecipient && activeRecipient.uid === uid) userItem.classList.add('active');

        userItem.innerHTML = `
          <img src="${userData.photoURL || defaultAvatar}" class="avatar" alt="Avatar">
          <div class="user-info">
            <div class="name">${userData.username || userData.email?.split('@')[0] || 'Player'}</div>
            <div class="subtext">Click to message</div>
          </div>
        `;

        userItem.addEventListener('click', () => selectUser(uid, userData));
        usersListEl.appendChild(userItem);
      });
    }

    // Search username and start a chat
    document.getElementById('user-search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const searchInput = document.getElementById('search-username');
      const targetUsername = searchInput.value.trim();

      if (!targetUsername) return;

      try {
        const q = query(collection(db, "users"), where("username", "==", targetUsername));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          alert(`User "${targetUsername}" not found.`);
          return;
        }

        let foundUid = null;
        let foundData = null;

        querySnapshot.forEach((docSnap) => {
          foundUid = docSnap.id;
          foundData = docSnap.data();
        });

        if (foundUid === currentUser.uid) {
          alert("You cannot message yourself.");
          return;
        }

        searchInput.value = '';
        selectUser(foundUid, foundData);
      } catch (err) {
        alert("Search failed: " + err.message);
      }
    });

    function selectUser(targetUid, targetData) {
      activeRecipient = { uid: targetUid, ...targetData };

      if (!activeConversations.has(targetUid)) {
        activeConversations.set(targetUid, targetData);
      }
      renderSidebarList();

      document.getElementById('active-chat-header').textContent = `Chat with ${targetData.username || 'Player'}`;
      document.getElementById('message-form').style.display = 'flex';

      listenForMessages();
    }

    function listenForMessages() {
      if (activeUnsubscribe) activeUnsubscribe();

      const roomId = getChatRoomId(currentUser.uid, activeRecipient.uid);
      const messagesContainer = document.getElementById('messages-container');

      // Query for messages where sender or recipient is current user in this specific roomId
      const qSent = query(
        collection(db, "messages"),
        where("roomId", "==", roomId),
        where("senderId", "==", currentUser.uid)
      );

      const qRecv = query(
        collection(db, "messages"),
        where("roomId", "==", roomId),
        where("recipientId", "==", currentUser.uid)
      );

      let sentMessages = [];
      let recvMessages = [];

      function updateUI() {
        messagesContainer.innerHTML = '';
        const allMessages = [...sentMessages, ...recvMessages];

        if (allMessages.length === 0) {
          messagesContainer.innerHTML = '<div class="empty-state">No messages yet. Say hi!</div>';
          return;
        }

        // Sort messages by timestamp ascending
        allMessages.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

        allMessages.forEach((msg) => {
          const isSentObj = msg.senderId === currentUser.uid;

          const msgBubble = document.createElement('div');
          msgBubble.className = `message ${isSentObj ? 'sent' : 'received'}`;
          
          const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          
          msgBubble.innerHTML = `
            <div>${msg.text}</div>
            <div class="message-time">${timeStr}</div>
          `;
          messagesContainer.appendChild(msgBubble);
        });

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      const unsubSent = onSnapshot(qSent, (snapshot) => {
        sentMessages = snapshot.docs.map(d => d.data());
        updateUI();
      }, (err) => {
        console.error("Sent messages error:", err);
        messagesContainer.innerHTML = `<div style="color:red; font-size:12px; margin:auto;">Error loading messages: ${err.message}</div>`;
      });

      const unsubRecv = onSnapshot(qRecv, (snapshot) => {
        recvMessages = snapshot.docs.map(d => d.data());
        updateUI();
      }, (err) => {
        console.error("Received messages error:", err);
      });

      activeUnsubscribe = () => {
        unsubSent();
        unsubRecv();
      };
    }

    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();

      if (!text || !activeRecipient) return;

      const roomId = getChatRoomId(currentUser.uid, activeRecipient.uid);
      inputEl.value = '';

      try {
        await addDoc(collection(db, "messages"), {
          roomId: roomId,
          senderId: currentUser.uid,
          recipientId: activeRecipient.uid,
          text: text,
          timestamp: Date.now()
        });

        if (!activeConversations.has(activeRecipient.uid)) {
          activeConversations.set(activeRecipient.uid, activeRecipient);
          renderSidebarList();
        }
      } catch (err) {
        alert("Failed to send message: " + err.message);
      }
    });
  </script>
</body>
</html>
