<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Game Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 1rem; background: #1f1f1f; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.2rem; text-transform: capitalize; }
    .game-container { flex: 1; width: 100%; height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
    .error { display: flex; align-items: center; justify-content: center; height: 100%; color: #ff5555; }
  </style>
</head>
<body>

  <header>
    <h1 id="game-name">Select a Game</h1>
  </header>

  <div class="game-container" id="container">
    <!-- Game IFrame gets generated here -->
  </div>

  <script>
    // Map URL parameters to game folder names
    const GAMES_REGISTRY = {
      'getaway-shootout': {
        title: 'Getaway Shootout',
        path: './getaway-shootout/GetawayShootout.github.io-main/index.html'
      }
      // Add future games here:
      // 'drive-mad': { title: 'Drive Mad', path: './drive-mad/index.html' }
    };

    // 1. Parse URL Query Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    const container = document.getElementById('container');
    const titleEl = document.getElementById('page-title');
    const headerEl = document.getElementById('game-name');

    // 2. Resolve Game & Embed Iframe
    if (gameId && GAMES_REGISTRY[gameId]) {
      const selectedGame = GAMES_REGISTRY[gameId];

      titleEl.innerText = selectedGame.title;
      headerEl.innerText = selectedGame.title;

      // Inject iframe dynamically
      container.innerHTML = `<iframe src="${selectedGame.path}" allowfullscreen></iframe>`;
    } else {
      container.innerHTML = `<div class="error"><h2>Game not found or parameter missing.</h2></div>`;
    }
  </script>

</body>
</html>
