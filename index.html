<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Planet ArcadiX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.5rem;
      background: #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    header a {
      color: #ffffff;
      text-decoration: none;
    }
    header a:hover {
      color: #ff5555;
    }
    .main-content {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      background: #121212;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Home Page Section Layout */
    .portal-home {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }
    .hero-section {
      text-align: center;
      margin-bottom: 3rem;
    }
    .hero-section h2 {
      font-size: 2.2rem;
      color: #ff5555;
      margin-bottom: 0.5rem;
    }
    .hero-section p {
      color: #aaa;
      font-size: 1.05rem;
    }
    .section-box {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1.25rem;
      border-bottom: 2px solid #ff5555;
      padding-bottom: 0.4rem;
      display: inline-block;
    }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }
    .game-card {
      background: #252525;
      border: 1px solid #383838;
      border-radius: 6px;
      padding: 1.25rem;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .game-card:hover {
      transform: translateY(-4px);
      border-color: #ff5555;
    }
    .game-card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .game-card span {
      font-size: 0.85rem;
      color: #ff5555;
    }
    .status-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #aaa;
      gap: 1rem;
    }
    .status-msg h2 {
      color: #ff5555;
    }
  </style>
</head>
<body>

  <header>
    <h1><a href="./" id="header-link">Planet ArcadiX</a></h1>
  </header>

  <main class="main-content" id="container">
    <!-- Dynamic Content or Home Grid -->
  </main>

  <script>
    // Registry mapping game query IDs to file paths relative to root
    const GAMES_REGISTRY = {
      'getaway-shootout': {
        title: 'Getaway Shootout',
        path: './Games/getaway-shootout/GetawayShootout.github.io-main/index.html'
      }
      // Add new games here as you upload them:
      // 'game-id': { title: 'Game Title', path: './Games/folder-name/index.html' }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('game');

    const container = document.getElementById('container');
    const titleEl = document.getElementById('page-title');
    const headerLink = document.getElementById('header-link');

    if (gameId && GAMES_REGISTRY[gameId]) {
      const selectedGame = GAMES_REGISTRY[gameId];

      titleEl.innerText = `${selectedGame.title} - Planet ArcadiX`;
      headerLink.innerText = `Planet ArcadiX - ${selectedGame.title}`;

      container.innerHTML = `
        <iframe 
          src="${selectedGame.path}" 
          allow="autoplay; gamepad; fullscreen; focus-without-user-activation" 
          allowfullscreen>
        </iframe>`;
    } else if (gameId) {
      container.innerHTML = `
        <div class="status-msg">
          <h2>Game Not Found</h2>
          <p>No game registered under id: <strong>${gameId}</strong></p>
          <a href="./" style="color: #ff5555; text-decoration: none;">Return to Home</a>
        </div>`;
    } else {
      // Home Page Layout with Section Boxes & Cards
      let cardsHTML = '';
      for (const [id, game] of Object.entries(GAMES_REGISTRY)) {
        cardsHTML += `
          <a href="?game=${id}" class="game-card">
            <h3>${game.title}</h3>
            <span>Play Now &rarr;</span>
          </a>`;
      }

      container.innerHTML = `
        <div class="portal-home">
          <div class="hero-section">
            <h2>Welcome to Planet ArcadiX</h2>
            <p>Select a game below to launch it directly in your browser.</p>
          </div>

          <div class="section-box">
            <div class="section-title">Featured Games</div>
            <div class="games-grid">
              ${cardsHTML}
            </div>
          </div>
        </div>`;
    }
  </script>

</body>
</html>
