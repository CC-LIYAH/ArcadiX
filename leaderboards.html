<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet ArcadiX | Leaderboards</title>

  <!-- Orbitron Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #050508;
      --card-bg: #110e1b;
      --card-border: #261f3b;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.5);
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --text-color: #ffffff;
      --text-muted: #9ca3af;
    }

    /* Global Font & Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-weight: 700;
    }

    /* Header Container & Navigation Styles */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(5, 5, 8, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-btn {
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #fff;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .logo-btn:hover { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }

    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { color: var(--text-color); text-decoration: none; font-weight: 700; font-size: 13px; opacity: 0.8; transition: opacity 0.2s; }
    .nav-links a:hover, .nav-links a.active { opacity: 1; text-shadow: 0 0 8px var(--accent-glow); }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 14px 4px 6px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .user-pill img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    /* Main Container */
    main {
      max-width: 900px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    /* Top Bar 1: Primary Category */
    .primary-bar {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .category-badge {
      background: var(--accent-color);
      color: #fff;
      padding: 10px 28px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 0 12px var(--accent-glow);
      letter-spacing: 0.5px;
    }

    /* Top Bar 2: Per-Game Selector Bar */
    .game-selector-bar {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .game-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .game-tab:hover { color: #fff; border-color: rgba(255,255,255,0.1); }
    .game-tab.active {
      background: rgba(168, 85, 247, 0.15);
      color: #fff;
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Leaderboard Card Table */
    .leaderboard-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      padding: 16px 28px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--card-border);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 800;
    }

    .leaderboard-list { display: flex; flex-direction: column; }

    .row {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      align-items: center;
      padding: 16px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s;
    }
    .row:hover { background: rgba(168, 85, 247, 0.06); }
    .row:last-child { border-bottom: none; }

    .rank { font-weight: 800; font-size: 14px; }
    .rank-1 { color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,0.4); }
    .rank-2 { color: var(--silver); text-shadow: 0 0 8px rgba(192,192,192,0.4); }
    .rank-3 { color: var(--bronze); text-shadow: 0 0 8px rgba(205,127,50,0.4); }

    .player-info { display: flex; align-items: center; gap: 12px; }
    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card-border);
      border: 1px solid var(--card-border);
    }
    .player-name { font-weight: 700; font-size: 13px; }

    .stat-value {
      font-weight: 800;
      text-align: right;
      color: var(--accent-color);
      font-size: 13px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .loading, .empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 12px; }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      margin-top: auto;
      background: var(--bg-color);
    }
  </style>
</head>
<body>

  <!-- Site Navigation Header -->
  <header>
    <a href="index.html" class="logo-btn">Planet ArcadiX</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="all-games.html">All Games</a>
      <a href="leaderboards.html" class="active">Leaderboards</a>
      <a href="updates.html">Updates</a>
      <a href="messages.html">Messages</a>
      <a href="admin.html">Admin</a>
      <div class="user-pill" id="nav-user-pill">
        <img id="nav-user-avatar" src="/ArcadiX/PAXIcons/PlaceholderPFP.png" alt="Profile">
        <span id="nav-user-name">SLASH</span>
      </div>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Global Leaderboards</h1>
    <p class="page-subtitle">Track top player rankings by playtime across Planet ArcadiX games!</p>

    <!-- Top Bar 1: Primary Category Header -->
    <div class="primary-bar">
      <div class="category-badge">Total Playtime</div>
    </div>

    <!-- Top Bar 2: Per-Game Selector Bar -->
    <div class="game-selector-bar">
      <button class="game-tab active" data-game="global">All Games (Global)</button>
      <button class="game-tab" data-game="getaway-shootout">Getaway Shootout</button>
      <button class="game-tab" data-game="slope">Slope</button>
      <button class="game-tab" data-game="basket-random">Basket Random</button>
      <button class="game-tab" data-game="astrorace-io">AstroRace.io</button>
    </div>

    <!-- Leaderboard Output -->
    <div class="leaderboard-card">
      <div class="leaderboard-header">
        <div>Rank</div>
        <div>Player</div>
        <div style="text-align: right;">Playtime</div>
      </div>

      <div class="leaderboard-list" id="leaderboard-rows">
        <div class="loading">Loading rankings...</div>
      </div>
    </div>
  </main>

  <footer>
    &copy; Planet ArcadiX 2026, All rights reserved
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIvUkO_paPfmMlbo5jNaXoteZL0fkZYa4",
      authDomain: "arcadix-7fc11.firebaseapp.com",
      projectId: "arcadix-7fc11",
      storageBucket: "arcadix-7fc11.appspot.com",
      messagingSenderId: "1024578621730",
      appId: "1:1024578621730:web:27adc1e3b5cdb802f1557b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const defaultAvatar = "/ArcadiX/PAXIcons/PlaceholderPFP.png";

    // Keep active logged-in user in top header
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('nav-user-name').textContent = user.displayName || user.email?.split('@')[0] || 'Player';
        if (user.photoURL) document.getElementById('nav-user-avatar').src = user.photoURL;
      }
    });

    function formatPlaytime(totalSeconds) {
      if (!totalSeconds) return "0m";
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
    }

    async function loadLeaderboard(gameId = 'global') {
      const listContainer = document.getElementById('leaderboard-rows');
      listContainer.innerHTML = '<div class="loading">Loading rankings...</div>';

      const sortField = gameId === 'global' ? 'playtime' : `playtime_${gameId}`;

      try {
        const q = query(
          collection(db, "users"),
          orderBy(sortField, "desc"),
          limit(25)
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          listContainer.innerHTML = '<div class="empty">No players logged for this category yet.</div>';
          return;
        }

        listContainer.innerHTML = '';
        let rank = 1;

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const rawValue = data[sortField] || 0;
          const formattedValue = formatPlaytime(rawValue);

          const row = document.createElement('div');
          row.className = 'row';

          let rankClass = '';
          if (rank === 1) rankClass = 'rank-1';
          else if (rank === 2) rankClass = 'rank-2';
          else if (rank === 3) rankClass = 'rank-3';

          row.innerHTML = `
            <div class="rank ${rankClass}">#${rank}</div>
            <div class="player-info">
              <img class="player-avatar" src="${data.photoURL || defaultAvatar}" alt="Avatar">
              <div class="player-name">${data.username || data.email?.split('@')[0] || 'Player'}</div>
            </div>
            <div class="stat-value">${formattedValue}</div>
          `;

          listContainer.appendChild(row);
          rank++;
        });

      } catch (err) {
        console.error("Error loading leaderboard:", err);
        listContainer.innerHTML = `<div class="empty">No players logged for this category yet.</div>`;
      }
    }

    // Attach listener events to game filter tabs
    document.querySelectorAll('.game-tab').forEach(button => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const gameId = e.target.getAttribute('data-game');
        loadLeaderboard(gameId);
      });
    });

    loadLeaderboard('global');
  </script>
</body>
</html>
