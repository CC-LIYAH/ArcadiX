<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet ArcadiX | Leaderboards</title>

  <!-- Orbitron Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #030108;
      --card-bg: #0c0618;
      --card-border: #2d174d;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --text-color: #ffffff;
      --text-muted: #8b80a2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Orbitron', sans-serif !important;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-weight: 700;
    }

    /* Site Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 40px;
      background: rgba(3, 1, 8, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-links a { 
      color: var(--text-color); 
      text-decoration: none; 
      font-weight: 700; 
      font-size: 13px; 
      opacity: 0.85; 
      transition: all 0.2s; 
    }
    .nav-links a:hover, .nav-links a.active { 
      opacity: 1; 
      color: #fff;
      text-shadow: 0 0 10px var(--accent-glow); 
    }

    /* Profile Pill & Dropdown */
    .user-pill-wrapper {
      position: relative;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
      padding: 5px 16px 5px 6px;
      border-radius: 30px;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .user-pill:hover {
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .user-pill img { 
      width: 28px; 
      height: 28px; 
      border-radius: 50%; 
      object-fit: cover; 
    }

    .profile-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 180px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 12px rgba(168, 85, 247, 0.15);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 200;
    }

    .profile-dropdown.show {
      display: flex;
    }

    .profile-dropdown a, .profile-dropdown button {
      padding: 12px 18px;
      color: var(--text-color);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--card-border);
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }

    .profile-dropdown a:last-child, .profile-dropdown button:last-child {
      border-bottom: none;
    }

    .profile-dropdown a:hover, .profile-dropdown button:hover {
      background: rgba(168, 85, 247, 0.15);
      color: #fff;
    }

    /* Main Container */
    main {
      max-width: 900px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-title {
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .section-banner {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .category-badge {
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #fff;
      padding: 10px 32px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 0 15px var(--accent-glow);
      letter-spacing: 0.5px;
    }

    /* Game Selector Bar */
    .game-selector-bar {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .game-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .game-tab:hover { 
      color: #fff; 
      border-color: rgba(168, 85, 247, 0.3); 
    }

    .game-tab.active {
      background: rgba(168, 85, 247, 0.15);
      color: #fff;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Leaderboard Table */
    .leaderboard-card {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      padding: 16px 28px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--card-border);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-weight: 800;
    }

    .leaderboard-list { display: flex; flex-direction: column; }

    .row {
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      align-items: center;
      padding: 16px 28px;
      border-bottom: 1px solid var(--card-border);
      transition: background 0.2s;
    }
    .row:hover { background: rgba(168, 85, 247, 0.06); }
    .row:last-child { border-bottom: none; }

    .rank { font-weight: 800; font-size: 14px; }
    .rank-1 { color: var(--gold); text-shadow: 0 0 8px rgba(255,215,0,0.4); }
    .rank-2 { color: var(--silver); text-shadow: 0 0 8px rgba(192,192,192,0.4); }
    .rank-3 { color: var(--bronze); text-shadow: 0 0 8px rgba(205,127,50,0.4); }

    .player-info { display: flex; align-items: center; gap: 12px; }
    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card-border);
      border: 1px solid var(--card-border);
    }
    .player-name { font-weight: 700; font-size: 13px; }

    .stat-value {
      font-weight: 800;
      text-align: right;
      color: var(--accent-color);
      font-size: 13px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .loading, .empty { padding: 40px; text-align: center; color: var(--text-muted); font-size: 12px; }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      margin-top: auto;
      background: var(--bg-color);
    }
  </style>
</head>
<body>

  <!-- Site Navigation Header -->
  <header>
    <a href="./" class="brand-logo">
      <img src="/ArcadiX/PAXIcons/LogoV2.png" alt="Planet ArcadiX" onerror="this.src='LogoV2.png';">
    </a>

    <nav class="nav-links">
      <a href="./">Home</a>
      <a href="./?page=all-games">All Games</a>
      <a href="leaderboards.html" class="active">Leaderboards</a>
      <a href="./?page=updates">Updates</a>
      <a href="messages.html">Messages</a>
      <a href="./?page=admin">Admin</a>

      <!-- Profile Pill & Dropdown -->
      <div class="user-pill-wrapper">
        <div class="user-pill" id="user-pill-btn">
          <img id="nav-user-avatar" src="/ArcadiX/PAXIcons/PlaceholderPFP.png" alt="Profile">
          <span id="nav-user-name">...</span>
        </div>

        <div class="profile-dropdown" id="profile-dropdown">
          <a href="./?page=profile" id="dropdown-profile-link">Profile</a>
          <a href="./?page=settings">Settings</a>
          <button id="logout-btn">Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Global Leaderboards</h1>
    <p class="page-subtitle">Track top player rankings by playtime across Planet ArcadiX games!</p>

    <!-- Top Bar 1: Primary Category -->
    <div class="section-banner">
      <div class="category-badge">Total Playtime</div>
    </div>

    <!-- Top Bar 2: Per-Game Selectors -->
    <div class="game-selector-bar">
      <button class="game-tab active" data-game="global">All Games (Global)</button>
      <button class="game-tab" data-game="getaway-shootout">Getaway Shootout</button>
      <button class="game-tab" data-game="slope">Slope</button>
      <button class="game-tab" data-game="basket-random">Basket Random</button>
      <button class="game-tab" data-game="astrorace-io">AstroRace.io</button>
    </div>

    <!-- Leaderboard Output -->
    <div class="leaderboard-card">
      <div class="leaderboard-header">
        <div>Rank</div>
        <div>Player</div>
        <div style="text-align: right;">Playtime</div>
      </div>

      <div class="leaderboard-list" id="leaderboard-rows">
        <div class="loading">Loading rankings...</div>
      </div>
    </div>
  </main>

  <footer>
    &copy; Planet ArcadiX 2026, All rights reserved
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIvUkO_paPfmMlbo5jNaXoteZL0fkZYa4",
      authDomain: "arcadix-7fc11.firebaseapp.com",
      projectId: "arcadix-7fc11",
      storageBucket: "arcadix-7fc11.appspot.com",
      messagingSenderId: "1024578621730",
      appId: "1:1024578621730:web:27adc1e3b5cdb802f1557b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const defaultAvatar = "/ArcadiX/PAXIcons/PlaceholderPFP.png";

    // Toggle Dropdown Menu
    const userPillBtn = document.getElementById('user-pill-btn');
    const profileDropdown = document.getElementById('profile-dropdown');

    userPillBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      profileDropdown.classList.toggle('show');
    });

    document.addEventListener('click', () => {
      profileDropdown.classList.remove('show');
    });

    // Logout Action
    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "./";
      });
    });

    // Dynamic Header User Data Sync
    onAuthStateChanged(auth, async (user) => {
      const nameElem = document.getElementById('nav-user-name');
      const avatarElem = document.getElementById('nav-user-avatar');
      const profileLink = document.getElementById('dropdown-profile-link');

      if (user) {
        try {
          const userDoc = await getDoc(doc(db, "users", user.uid));

          if (userDoc.exists()) {
            const userData = userDoc.data();
            
            // Reads the exact 'userId' sequential number field from the document
            const sequentialId = userData.userId !== undefined ? userData.userId : user.uid;

            nameElem.textContent = userData.username || userData.displayName || user.displayName || user.email?.split('@')[0] || 'Player';
            if (userData.photoURL) avatarElem.src = userData.photoURL;
            else if (user.photoURL) avatarElem.src = user.photoURL;

            profileLink.href = `./?user=${sequentialId}`;
          } else {
            nameElem.textContent = user.displayName || user.email?.split('@')[0] || 'Player';
            if (user.photoURL) avatarElem.src = user.photoURL;

            profileLink.href = `./?user=${user.uid}`;
          }
        } catch (e) {
          nameElem.textContent = user.displayName || user.email?.split('@')[0] || 'Player';
          profileLink.href = `./?user=${user.uid}`;
        }
      } else {
        nameElem.textContent = "Guest";
        profileLink.href = "./?page=login";
      }
    });

    function formatPlaytime(totalSeconds) {
      if (!totalSeconds) return "0m";
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      return hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
    }

    async function loadLeaderboard(gameId = 'global') {
      const listContainer = document.getElementById('leaderboard-rows');
      listContainer.innerHTML = '<div class="loading">Loading rankings...</div>';

      const sortField = gameId === 'global' ? 'playtime' : `playtime_${gameId}`;

      try {
        const q = query(
          collection(db, "users"),
          orderBy(sortField, "desc"),
          limit(25)
        );

        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          listContainer.innerHTML = '<div class="empty">No players logged for this category yet.</div>';
          return;
        }

        listContainer.innerHTML = '';
        let rank = 1;

        snapshot.forEach((docSnap) => {
          // Ignore the special counter document if its ID is "1"
          if (docSnap.id === "1") return;

          const data = docSnap.data();
          const rawValue = data[sortField] || 0;
          const formattedValue = formatPlaytime(rawValue);

          const row = document.createElement('div');
          row.className = 'row';

          let rankClass = '';
          if (rank === 1) rankClass = 'rank-1';
          else if (rank === 2) rankClass = 'rank-2';
          else if (rank === 3) rankClass = 'rank-3';

          row.innerHTML = `
            <div class="rank ${rankClass}">#${rank}</div>
            <div class="player-info">
              <img class="player-avatar" src="${data.photoURL || defaultAvatar}" alt="Avatar">
              <div class="player-name">${data.username || data.displayName || data.email?.split('@')[0] || 'Player'}</div>
            </div>
            <div class="stat-value">${formattedValue}</div>
          `;

          listContainer.appendChild(row);
          rank++;
        });

      } catch (err) {
        console.error("Error loading leaderboard:", err);
        listContainer.innerHTML = `<div class="empty">No players logged for this category yet.</div>`;
      }
    }

    // Attach tab click events
    document.querySelectorAll('.game-tab').forEach(button => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.game-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const gameId = e.target.getAttribute('data-game');
        loadLeaderboard(gameId);
      });
    });

    loadLeaderboard('global');
  </script>
</body>
</html>
